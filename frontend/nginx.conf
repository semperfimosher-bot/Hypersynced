server {
    listen 80;
    server_name _;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Keep browser API and realtime traffic same-origin. The Docker
    # entrypoint renders this template using API_UPSTREAM_URL and
    # API_UPSTREAM_HOST, allowing staging to use its own backend.
    location /api/ {
        client_max_body_size 64m;
        proxy_http_version 1.1;

        proxy_set_header Host ${API_UPSTREAM_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_ssl_server_name on;
        proxy_ssl_name ${API_UPSTREAM_HOST};

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_pass ${API_UPSTREAM_URL};
    }

    # Vite's hashed JS/CSS assets are immutable only when they exist.
    # Missing bundles must never inherit a cacheable response: a cached 404
    # can outlive a deployment and keep a valid bundle inaccessible.
    location /assets/ {
        try_files $uri @missing_asset;

        include /etc/nginx/security-headers.conf;

        add_header Cache-Control
            "public, max-age=31536000, immutable";
    }

    location @missing_asset {
        include /etc/nginx/security-headers.conf;

        add_header Cache-Control
            "no-store, no-cache, must-revalidate" always;
        return 404;
    }

    # The service worker is versioned by its contents, not its URL.
    # Always revalidate it so browsers cannot retain an old worker script.
    location = /sw.js {
        try_files $uri =404;

        include /etc/nginx/security-headers.conf;

        add_header Cache-Control
            "no-cache, no-store, must-revalidate" always;
    }

    location = /app-shell-manifest.json {
        try_files $uri =404;

        add_header Cache-Control
            "no-cache, no-store, must-revalidate" always;
    }

    # The root document and SPA routes must always revalidate after deploys.
    # Cloudflare/Varnish must not keep an old index that references deleted hashes.
    location = / {
        try_files /index.html =404;

        include /etc/nginx/security-headers.conf;

        add_header Cache-Control
            "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        try_files $uri =404;

        include /etc/nginx/security-headers.conf;

        add_header Cache-Control
            "no-cache, no-store, must-revalidate" always;
    }

    # React SPA routes may fall back to index.html, but never cache HTML.
    location / {
        try_files $uri $uri/ /index.html;

        include /etc/nginx/security-headers.conf;

        add_header Cache-Control
            "no-cache, no-store, must-revalidate" always;
    }
}
